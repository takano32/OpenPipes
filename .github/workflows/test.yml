name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # the whole range package.json claims support for
        node-version: ['22', '24']
    name: node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # No install step: OpenPipes has zero dependencies, so there is
      # nothing to fetch and no lockfile for `npm ci` to read.
      - run: npm test

      # public/editor.js runs in the browser, so the suite never loads it.
      - name: Syntax-check the editor
        run: node --check public/editor.js

  # The editor is only exercised by a real browser, and the CDP client needs a
  # global WebSocket, so this runs on one modern Node rather than the matrix.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: editor (browser)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run the browser tests
        run: npm run test:e2e
        env:
          CHROME_BIN: /usr/bin/google-chrome
